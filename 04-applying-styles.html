<!DOCTYPE html>
<html lang="en">
    <head>

        <title> Circle </title>

        <style>
            .circle{

                height: 100px;
                width: 100px;
                border-radius: 50%;
            }
            #person {
                background-color:rgb(231, 183, 225);
                height: 100px;
                width: 50px;

            }
        </style>
</head>

        <div class="circle"> Dit is een circle </div>
        <div id="person"> </div>
        <a href="04-applying-styles.html" id="person" class=".circle"> Klik op deze link </a>
        </body>
</html>
